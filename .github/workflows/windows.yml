name: Windows desktop
on:
  workflow_dispatch:
  push:
    branches: [main, desktop]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: python -m pip install -r requirements-build.txt
      - run: npm ci
      - run: python -B scripts/secret_scan.py
      - run: python -B -m unittest discover -s tests -v
      - run: node scripts/check_ui.cjs
      - run: python scripts/make_icons.py
      - run: python scripts/build_backend.py
      - run: python scripts/smoke_backend.py src-tauri/binaries/xea-backend-x86_64-pc-windows-msvc.exe
      - run: python scripts/collect_notices.py
      - run: npm run desktop:build
      - name: Package installer and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item -LiteralPath $installer.FullName -Destination artifacts/X-Engagement-Assistant-Setup.exe
          (Get-FileHash artifacts/X-Engagement-Assistant-Setup.exe -Algorithm SHA256).Hash | Set-Content artifacts/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: X-Engagement-Assistant-Windows
          path: artifacts/*
          if-no-files-found: error
